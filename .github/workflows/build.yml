name: Build

on: [push, pull_request]

jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@main
              with:
                submodules: true
            - uses: denoland/setup-deno@v2
            - name: build & test debug
              run: |
                ./fibs config win-vstudio-x64-debug
                ./fibs build
                ./fibs runtests win-vstudio-x64-debug
            - name: build & test release
              run: |
                ./fibs config win-vstudio-x64-release
                ./fibs build
                ./fibs runtests win-vstudio-x64-release
    mac:
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@main
              with:
                submodules: true
            - uses: ashutoshvarma/setup-ninja@master
            - uses: denoland/setup-deno@v2
            - name: build & test debug
              run: |
                ./fibs config macos-x64-ninja-debug
                ./fibs build
                ./fibs runtests macos-x64-ninja-debug
            - name: build & test release
              run: |
                ./fibs config macos-x64-ninja-release
                ./fibs build
                ./fibs runtests macos-x64-ninja-release
    linux:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@main
              with:
                submodules: true
            - uses: ashutoshvarma/setup-ninja@master
            - uses: denoland/setup-deno@v2
            - name: build & test debug
              run: |
                ./fibs config linux-x64-ninja-debug
                ./fibs build
                ./fibs runtests linux-x64-ninja-debug
            - name: build & test release
              run: |
                ./fibs config linux-x64-ninja-release
                ./fibs build
                ./fibs runtests linux-x64-ninja-release
    linux-arm64:
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@main
              with:
                submodules: true
            - uses: denoland/setup-deno@v2
            # NOTE: setup-ninja action doesn't work on ARM Linux, install x86 exe
            - name: install ninja
              run: |
                sudo apt-get update
                sudo apt install ninja-build
            - name: build & test debug
              run: |
                ./fibs config linux-arm64-ninja-debug
                ./fibs build
                ./fibs runtests linux-arm64-ninja-debug
            - name: build & test release
              run: |
                ./fibs config linux-arm64-ninja-release
                ./fibs build
                ./fibs runtests linux-arm64-ninja-release
